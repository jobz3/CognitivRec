# Stage 2, owners: Mudit and Abhinav. Searched on the validation split.
# The selected values are written to configs/tuned/cognitive.yaml.
search:
  n_trials: 100 # random trials; the model's defaults are always included as well
  seed: 7
  # RPE only acts on observed feedback, so a one-shot ranking cannot measure it.
  objective: replay_ndcg
  grid:
    n_factors: [16, 32, 64, 128]
    memory_size: [6, 12, 24]
    base_alpha: [0.2, 0.35, 0.55, 0.75]
    decay_lambda: [0.0, 0.05, 0.15, 0.3]
    attention_temperature: [0.1, 0.3, 1.0, 5.66] # 5.66 is the plan's sqrt(d) at d = 32
    rpe_lr: [0.12, 0.3, 0.6, 1.0]
    lt_rate: [0.02, 0.05, 0.1]
    normalize_embeddings: [true, false]

beta_selection:
  grid: [0.0, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.18, 0.3, 0.5]
  # Highest coverage that costs at most this share of Model C's NDCG. Picking by NDCG alone
  # would always choose beta = 0.
  max_ndcg_loss: 0.10
