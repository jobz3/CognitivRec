[project]
name = "cognitiverec"
version = "0.1.0"
description = "Brain-inspired recommendation: fairness, explainability and reliability through cognitive mechanisms."
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds only, so Colab's preinstalled versions are used as they are.
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitiverec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: downloads MovieLens 100K and runs against the real data"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks", "data", "results", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
